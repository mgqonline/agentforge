[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge AI 工程学习与实践平台"
requires-python = ">=3.10,<3.13"
dependencies = [
  "langchain",
  "langchain-openai",
  "langgraph",
  "openai",
  "python-dotenv",
  "chromadb",
  "tiktoken",
  "mcp",
  "langchain-chroma",
  "langchain-community",
  "langchain-text-splitters",
  "sentence-transformers",
  "langchain-huggingface",
  "pymysql",
  "SQLAlchemy",
  "celery",
  "redis",
  "psycopg2-binary",
  "asyncpg",
  "psycopg[binary]",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv]
default-groups = ["dev"]