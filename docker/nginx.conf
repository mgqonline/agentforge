server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # 客户端上传限制（支持大文件/音视频/大图片上传）
    client_max_body_size 100M;

    # Gzip 压缩加速
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. 根路由：React 现代企业级工作空间 (默认主站)
    location / {
        root /usr/share/nginx/html/react;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. 原生轻量旗舰终端 (/vanilla/)
    location /vanilla/ {
        alias /usr/share/nginx/html/vanilla/;
        index index.html index.htm;
        try_files $uri $uri/ /vanilla/index.html;
    }

    # 3. 反向代理后端 HTTP API 接口
    location /api/ {
        proxy_pass http://backend:6001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 4. 反向代理后端 WebSocket 全双工长连接
    location /ws/ {
        proxy_pass http://backend:6001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. API 接口文档直达
    location /docs {
        proxy_pass http://backend:6001/docs;
    }

    location /openapi.json {
        proxy_pass http://backend:6001/openapi.json;
    }

    # 静态资源缓存控制
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html/react;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
