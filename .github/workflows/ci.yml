name: AgentForge CI & Quality Guard

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-and-security:
    name: E2E Smoke & Security Hardening Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic sqlalchemy aiosqlite greenlet

      - name: Run AgentForge Doctor
        run: |
          python scripts/agentforge_cli.py doctor

      - name: Run E2E Smoke Tests
        run: |
          python tests/test_e2e_smoke.py -v

      - name: Run RBAC & Token Budget Security Suite
        run: |
          python backend/auth_governance.py

      - name: Run AST Sandbox Escape Defense Suite
        run: |
          python backend/security_sandbox.py
