services:
  postgres:
    image: postgres:15-alpine
    container_name: ailearning_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipassword}
      POSTGRES_DB: ${POSTGRES_DB:-ailearning}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ailearning_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiuser} -d ${POSTGRES_DB:-ailearning}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ailearning_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ailearning_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ailearning_backend
    restart: unless-stopped
    ports:
      - "6001:6001"
    env_file:
      - .env
    environment:
      - PORT=6001
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-aiuser}:${POSTGRES_PASSWORD:-aipassword}@postgres:5432/${POSTGRES_DB:-ailearning}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aiuser}:${POSTGRES_PASSWORD:-aipassword}@postgres:5432/${POSTGRES_DB:-ailearning}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:6000,http://127.0.0.1:6000,http://localhost:6001,http://127.0.0.1:6001,http://localhost:6002,http://127.0.0.1:6002,http://localhost:8000,http://localhost:5173,http://localhost:5174
      - OPENAI_BASE_URL=https://api.deepseek.com
      - OPENAI_API_BASE=https://api.deepseek.com
    volumes:
      - .:/app/curriculum:ro
      - ./backend:/app/backend
      - ./chroma_db:/app/backend/chroma_db
      - ./models:/app/backend/models
      - ./logs:/app/backend/logs
      - ./document_processor/samples:/app/document_processor/samples
    networks:
      - ailearning_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6001/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ailearning_frontend
    restart: unless-stopped
    ports:
      - "6002:80"
      - "6000:80"
    volumes:
      - ./frontend-react/dist:/usr/share/nginx/html/react:ro
    networks:
      - ailearning_net
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  ailearning_net:
    driver: bridge
